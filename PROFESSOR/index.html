<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi | Área do Professor</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="background"></div>
    <div class="login-card">
        <img src="img/logo.png" class="logo" alt="Lumi">
        <h1>Área do Professor</h1>
        <p>
            Faça login para acessar seu painel.
        </p>

        <form action="php/login.php" method="POST">
            <input type="email" name="email" placeholder="E-mail" autocomplete="email" required>
            <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required>
            <button type="submit" class="entrar">
                Entrar
            </button>
        </form>

        <button type="button" class="google" id="googleLogin">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google">
            <span id="googleTexto">
                Entrar com Google
            </span>
        </button>

        <p id="googleMensagem" style="
                display:none;
                margin-top:15px;
                margin-bottom:0;
                font-size:14px;
            "></p>

        <div class="links">
            <a href="cadastro.php">
                Criar Conta
            </a>
            <a href="recuperar.php">
                Esqueci minha senha
            </a>
        </div>
    </div>

    <script type="module">
        import {
            initializeApp
        }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup
        }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhCvVJlHIwEwiYShKXOkcHrzpMgxGwDFo",

            authDomain:
                "lumi-for-teachers.firebaseapp.com",

            projectId:
                "lumi-for-teachers",

            storageBucket:
                "lumi-for-teachers.firebasestorage.app",

            messagingSenderId:
                "1063473511779",

            appId:
                "1:1063473511779:web:8344fbd922b2c34bf4a756"
        };

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const provider =
            new GoogleAuthProvider();

        const botaoGoogle =
            document.getElementById("googleLogin");

        const textoGoogle =
            document.getElementById("googleTexto");

        const mensagem =
            document.getElementById("googleMensagem");

        botaoGoogle.addEventListener(
            "click",
            async function () {
                try {
                    botaoGoogle.disabled = true;

                    textoGoogle.textContent =
                        "Conectando...";

                    mensagem.style.display =
                        "none";

                    const resultado =
                        await signInWithPopup(
                            auth,
                            provider
                        );

                    const user =
                        resultado.user;

                    console.log(
                        "Usuário Firebase:",
                        user
                    );

                    const idToken =
                        await user.getIdToken(true);

                    console.log(
                        "ID Token obtido."
                    );

                    const resposta =
                        await fetch(
                            "php/login_google.php",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/json",
                                    "Accept":
                                        "application/json"
                                },
                                body:
                                    JSON.stringify({
                                        idToken:
                                            idToken
                                    })
                            }
                        );

                    const textoResposta =
                        await resposta.text();

                    console.log(
                        "Resposta PHP:",
                        textoResposta
                    );

                    let dados;

                    try {
                        dados =
                            JSON.parse(
                                textoResposta
                            );
                    } catch (erroJSON) {
                        console.error(
                            "Resposta inválida do PHP:",
                            textoResposta
                        );
                        throw new Error(
                            "O servidor retornou uma resposta inválida. Verifique o login_google.php."
                        );
                    }

                    if (
                        !resposta.ok ||
                        !dados.sucesso
                    ) {
                        throw new Error(
                            dados.mensagem ||
                            "Não foi possível realizar o login com Google."
                        );
                    }

                    window.location.href =
                        dados.redirecionar ||
                        "painel.php";
                } catch (erro) {
                    console.error(
                        "Erro no login Google:",
                        erro
                    );

                    mensagem.style.display =
                        "block";

                    mensagem.style.color =
                        "#e74c3c";

                    mensagem.textContent =
                        "Erro ao entrar com Google: " +
                        (
                            erro.message ||
                            "Erro desconhecido."
                        );

                    botaoGoogle.disabled =
                        false;

                    textoGoogle.textContent =
                        "Entrar com Google";
                }
            }
        );
    </script>

    <script src="js/script.js"></script>
</body>

</html>
